server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 20m;

    # Flask backend (mirrors the Vite dev proxy: /api/flask/* -> backend/*)
    location /api/flask/ {
        proxy_pass http://backend:5000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }

    # BGR soil services (mirrors the Vite dev proxy: /api/bgr/* -> services.bgr.de/*)
    location /api/bgr/ {
        resolver 1.1.1.1 8.8.8.8 valid=300s;
        set $bgr_upstream https://services.bgr.de;
        rewrite ^/api/bgr/(.*)$ /$1 break;
        proxy_pass $bgr_upstream;
        proxy_set_header Host services.bgr.de;
        proxy_ssl_server_name on;
    }

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }
}
